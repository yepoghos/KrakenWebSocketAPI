# pytest configuration.
#
# The goal here is CI-friendly output: every test is listed with its PASS/FAIL
# status (-v), assertion introspection is enabled (default), and short tracebacks
# keep failure output readable in a pipeline log.
[pytest]
# Where the tests live.
testpaths = tests

# Make `import kraken_ws` work without installing the package: add ./src to sys.path.
pythonpath = src

# -v            : verbose, one line per test with PASS/FAIL.
# -ra           : show a short summary of skipped/failed reasons at the end.
# --strict-markers: fail if an unknown marker is used (protects against typos).
# --color=yes   : keep colored output when the terminal/CI supports it.
addopts = -v -ra --strict-markers --color=yes

# Custom markers. Declaring them here (with --strict-markers) documents intent
# and prevents accidental silent typos like @pytest.mark.livee.
markers =
    live: test hits the live public Kraken WebSocket API (requires network).
    v1: exercises the Kraken WebSocket API v1 (wss://ws.kraken.com).
    v2: exercises the Kraken WebSocket API v2 (wss://ws.kraken.com/v2).
    book: order book channel tests.
    ohlc: OHLC (candles) channel tests.
    ticker: ticker channel tests.
    trade: trade channel tests.
    connection: connection/status/heartbeat tests.
    subscription: subscription lifecycle / input-validation tests.
